<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e2c" />
    <meta name="description" content="AzurPilot" />
    <script>
      // 隧道反代入口形如 /<peer_id>，不带尾斜杠时相对路径会丢掉前缀而打到服务端。
      // 只在单段路径（隧道入口形态）补斜杠；根路径、已带斜杠与多段路径一律不动。
      if (/^\/[^/]+$/.test(location.pathname)) {
        document.write('<base href="' + location.pathname + '/">');
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%azurpilot.svg" />
    <title>AzurPilot</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
