services:
    ALAS:
        container_name: "alas"
        image: "${ALAS_IMAGE:-alas:py314}"
        build:
            context: .
            dockerfile: ./deploy/docker/Dockerfile
            args:
                UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
                UV_EXTRA_INDEX_URL: ${UV_EXTRA_INDEX_URL:-}
                GIT_REVISION: ${GIT_REVISION:-unknown}
        network_mode: host
        restart: unless-stopped
        init: true
        stop_grace_period: 60s
        working_dir: /app/AzurPilot
        environment:
            TZ: ${TZ:-Asia/Shanghai}
            PYTHONDONTWRITEBYTECODE: "1"
            PYTHONUNBUFFERED: "1"
            ALAS_WEBUI_PORT: ${ALAS_WEBUI_PORT:-22267}
        volumes:
            # 直接使用本地源码及运行数据，编辑后无需重建镜像。
            - '.:/app/AzurPilot:rw'
            # 隔离宿主机依赖，Python 环境首次创建时从镜像复制。
            - 'alas-python:/app/AzurPilot/.venv'
            - 'alas-node-modules:/app/AzurPilot/frontend/node_modules'
            - 'alas-frontend:/app/AzurPilot/frontend/dist'
            # - '../MAA:/app/MAA:rw'
            - '/etc/localtime:/etc/localtime:ro'
        command:
            - /bin/sh
            - -ec
            - |
                uv sync --frozen --python /usr/local/bin/python
                exec .venv/bin/python gui.py --port "$$ALAS_WEBUI_PORT"
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test:
                [
                    "CMD",
                    ".venv/bin/python",
                    "-c",
                    "import json, os, urllib.request; port = os.environ['ALAS_WEBUI_PORT']; response = urllib.request.urlopen(f'http://127.0.0.1:{port}/healthz', timeout=3); assert json.load(response)['status'] == 'ok'",
                ]
            interval: 30s
            timeout: 5s
            retries: 6
            start_period: 90s

volumes:
    alas-python:
    alas-node-modules:
    alas-frontend:
